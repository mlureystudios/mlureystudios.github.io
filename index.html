<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mlurey Studios</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="site">

        <header>
            <div class="header-top">
                <h1>Mlurey Studios</h1>
                <p>Indie Game Development studio</p>
            </div>

            <nav>
                <a href="index.html">Home</a>
                <a href="devlog.html">Dev Log</a>
                <a href="contacts.html">Contacts</a>
            </nav>
        </header>

        <main>

            <div class="content">

                <h2>Welcome to Mlurey Studios</h2>

                <p>
                    Welcome to the official Mlurey Studios website.
                </p>

                <section class="latest-video">

                    <h2>Latest Video</h2>

                    <div id="video-container">
                        <p>Loading latest video...</p>
                    </div>

                </section>

            </div>

            <aside>
                <h3>Navigation</h3>

                <a href="index.html">Home</a>
                <a href="devlog.html">Dev Log</a>
                <a href="contacts.html">Contacts</a>
            </aside>

        </main>

        <footer>
            Mlurey Studios &copy; 2026
        </footer>

    </div>

    <script>
        const CHANNEL_ID = "UCzrrDnKEYrvCbdw7Gl7Cmbw";

        const RSS_URL =
            `https://www.youtube.com/feeds/videos.xml?channel_id=${CHANNEL_ID}`;

        async function loadLatestVideo() {

            const container =
                document.getElementById("video-container");

            try {

                const response = await fetch(
                    `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(RSS_URL)}`
                );

                if (!response.ok) {
                    throw new Error("Failed to load feed");
                }

                const data = await response.json();

                if (data.status !== "ok" || !data.items || data.items.length === 0) {
                    throw new Error("No videos found");
                }

                const video = data.items[0];

                const videoId = video.guid
                    .replace("yt:video:", "");

                const title = video.title;

                const description =
                    video.description || "No description available.";

                container.innerHTML = `
                    <div class="video-card">

                        <div class="video-player">
                            <iframe
                                src="https://www.youtube.com/embed/${videoId}"
                                title="${escapeHtml(title)}"
                                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                                allowfullscreen>
                            </iframe>
                        </div>

                        <div class="video-info">

                            <h3>
                                ${escapeHtml(title)}
                            </h3>

                            <p>
                                ${escapeHtml(description)
                                    .replace(/\n/g, "<br>")}
                            </p>

                            <a8
                                href="https://www.youtube.com/watch?v=${videoId}"
                                target="_blank"
                                rel="noopener noreferrer">
                                Watch on YouTube
                            </a>

                        </div>

                    </div>
                `;

            } catch (error) {

                console.error(error);

                container.innerHTML = `
                    <div class="video-error">
                        <h3>Unable to load latest video</h3>
                        <p>
                            The latest video could not be loaded right now.
                        </p>
                    </div>
                `;
            }
        }

        function escapeHtml(text) {

            const div = document.createElement("div");

            div.textContent = text;

            return div.innerHTML;
        }

        loadLatestVideo();
    </script>

</body>

</html>
